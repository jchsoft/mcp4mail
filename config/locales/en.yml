  mail_accounts:
    index:
      title: "Mailboxes"
      add: "Add mailbox"
      empty: "You have not added a mailbox yet. Add one, then connect your AI app."
      last_error: "Last connection failed: %{error}"
      remove: "Remove"
      remove_confirm: "Remove %{name}? mcp4mail forgets its password and the message index; your mail on the server is not touched."
      connect_ai: "Next: connect your AI app →"
    new:
      title: "Add a mailbox"
      intro: "mcp4mail reads your mail over IMAP. Pick your provider and the server settings fill themselves in."
      provider: "Provider"
      provider_other: "Other - I will enter the server myself"
      username_placeholder: "Usually your full email address"
      password_hint: "Use an app password wherever your provider offers one: it can be revoked on its own and is not the key to your whole account. It is stored encrypted."
      display_name_placeholder: "e.g. Work"
      submit: "Test connection and add"
      submitting: "Testing connection…"
      submit_hint: "We sign in to the server first and save the mailbox only if that works."
      outcomes:
        auth_failed:
          title: "The server rejected the username or password."
          hint: "Check the username (usually the full email address) and the password. Many providers require an app password and IMAP access switched on in the mailbox settings."
        tls_problem:
          title: "The secure connection to the server failed."
          hint: "Check that the port and SSL/TLS match: 993 with SSL/TLS is the usual choice. The server's certificate may also not match the host name - try the host name your provider documents."
        unreachable:
          title: "The server could not be reached."
          hint: "Check the server name and port. If your provider runs IMAP on a different host than its website, look it up in their help pages."
    create:
      success: "Mailbox %{name} added. Its messages are being indexed in the background."
    destroy:
      success: "Mailbox %{name} removed."
    providers:
      seznam: "Switch on IMAP access in Seznam Email settings (Settings → POP3/IMAP). With two-step verification, create an app password."
      gmail: "Gmail requires two-step verification and an app password (Google Account → Security → App passwords). Your regular Google password will not work."
      outlook: "Use your full Outlook address. If your account has two-step verification, create an app password. Some Microsoft 365 organisations disable password sign-in for IMAP."
      icloud: "Use your iCloud address and an app-specific password from account.apple.com."
      yahoo: "Create an app password in Yahoo Account Security; your regular password will not work."
      centrum: "Switch on IMAP access in the Centrum mail settings first."
      volny: "Switch on IMAP access in the Volný mail settings first."
      forpsi: "Use the full email address as the username and the mailbox password from the Forpsi administration."
      active24: "Use the full email address as the username and the mailbox password from the Active24 customer centre."
      cpanel: "Enter the IMAP server your hosting shows next to the mailbox, usually mail.your-domain.com. Use the full email address as the username."

  connect_ai:
    show:
      title: "Connect AI"
      intro: "Add mcp4mail to your AI app as a custom connector (MCP server). The app then sends you here to sign in and approve access, and can read and search the mailboxes you added."
      no_mailbox: "You have no mailbox yet, so your AI app would find nothing to read."
      add_mailbox: "Add a mailbox first."
      url_title: "Server URL"
      url_hint: "Paste this URL into your AI app. You do not need an API key: the app asks you to sign in to mcp4mail instead."
      copy: "Copy"
      copied: "Copied"
      consent:
        title: "What the approval screen asks"
        description: "After you add the connector, the app opens mcp4mail. Sign in, and you will see “Authorize <app>: <app> is requesting access to your mcp4mail account”, with the access scope mcp. Click Approve."
        points:
          - "Approving lets the app list your mailboxes, search them and read messages, in your name."
          - "Access is read-only: it never sends, moves, deletes or re-flags any message."
          - "Every request is written to your audit log. To disconnect, remove the connector in the AI app."
          - "If the screen warns that the app runs on your own computer, that is expected for desktop apps such as Cursor. Approve only if you started it yourself."
      clients:
        claude:
          title: "Claude"
          steps:
            - "Open claude.ai → Settings → Connectors and click Add custom connector."
            - "Name it mcp4mail, paste the server URL and click Add."
            - "Click Connect. Sign in to mcp4mail and click Approve."
            - "In a chat, turn the mcp4mail connector on in the tools menu and ask, e.g. “What did the accountant send me last week?”."
        chatgpt:
          title: "ChatGPT"
          steps:
            - "In Settings → Apps & Connectors → Advanced settings turn on Developer mode (Plus, Pro, Business or Enterprise)."
            - "Back in Apps & Connectors, click Create. Name it mcp4mail, paste the server URL and choose OAuth as authentication."
            - "Confirm that you trust the application and click Create. Sign in to mcp4mail and click Approve."
            - "In a new chat, pick Developer mode and the mcp4mail connector from the + menu."
        grok:
          title: "Grok"
          steps:
            - "Open grok.com/connectors and choose New → Custom."
            - "Paste the server URL and save."
            - "Allow pop-ups for grok.com – sign-in opens in a new window. Safari blocks it and Grok then reports a failure even though sign-in succeeded: in Safari → Settings → Websites → Pop-up Windows set grok.com to Allow."
            - "Sign in to mcp4mail and click Approve."
        cursor:
          title: "Cursor"
          steps:
            - "Open Cursor Settings → Tools & MCP and click New MCP Server. Cursor opens your mcp.json (~/.cursor/mcp.json for all projects)."
            - "Add the mcp4mail entry below and save the file."
            - "Back in Tools & MCP, click Connect next to mcp4mail. Your browser opens: sign in to mcp4mail and click Approve."
