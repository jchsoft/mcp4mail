        chatgpt:
          title: "ChatGPT"
          steps: "V Settings, Apps & Connectors, Advanced settings zapněte Developer mode, vraťte se zpět, klikněte na Create, vložte adresu a zvolte OAuth. Potvrďte a v okně, které se otevře, přístup schvalte."
        cursor:
          title: "Cursor"
          steps: "Otevřete Cursor Settings, Tools & MCP, New MCP Server a do souboru mcp.json, který se otevře, přidejte mcp4mail s touto adresou. Zpět v Tools & MCP klikněte na Connect a v prohlížeči přístup potvrďte."
        other:
          title: "Jiný MCP klient"
          steps: "Přidejte mcp4mail jako vzdálený MCP server přes HTTP s adresou výše; není co instalovat, žádný příkaz ani balíček. Pokud se klient ptá na způsob ověření, zvolte OAuth."
