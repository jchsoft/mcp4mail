name: Feature request
description: Suggest an improvement to mcp4mail
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        mcp4mail is small on purpose and the MCP endpoint is read-only by default. See [CONTRIBUTING.md](https://github.com/jchsoft/mcp4mail/blob/main/CONTRIBUTING.md).
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that you cannot do today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: input
    id: tool
    attributes:
      label: Which MCP tool does it concern?
      description: Leave empty if it is not about a specific tool.
      placeholder: e.g. search_messages
